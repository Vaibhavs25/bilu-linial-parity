name: Build submission PDF

on:
  push:
    branches:
      - final-2026-09-19-submission

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: final_combined_paper_final.tex
          working_directory: submission

      - name: Commit generated PDF
        shell: bash
        run: |
          set -e
          test -f submission/final_combined_paper_final.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/final_combined_paper_final.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Build final submission PDF"
          git push

# Trigger build on branch update.
